<div
  class="iris-checkbox"
  [attr.role]="decorative() ? 'presentation' : 'checkbox'"
  [attr.tabindex]="decorative() ? null : 0"
  [class.iris-checkbox--md]="size() === 'md'"
  [class.iris-checkbox--disabled]="isDisabled()"
  [attr.aria-checked]="decorative() ? null : indeterminate() ? 'mixed' : checked()"
  [attr.aria-disabled]="decorative() ? null : isDisabled()"
  [attr.aria-label]="decorative() ? null : label()"
  [attr.aria-describedby]="!decorative() && supportingText() ? supportingTextId : null"
  (click)="toggle()"
  (keydown.space)="toggle(); $event.preventDefault()">
  <span class="iris-checkbox__container">
    <span
      class="iris-checkbox__box"
      [class.iris-checkbox__box--checked]="state() === 'checked'"
      [class.iris-checkbox__box--mixed]="state() === 'mixed'">
      <svg viewBox="0 0 12 12" class="iris-checkbox__icon" aria-hidden="true" [style.visibility]="state() === 'checked' ? 'visible' : 'hidden'">
        <polyline points="2 6 5 9 10 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <svg
        viewBox="0 0 12 12"
        class="iris-checkbox__icon iris-checkbox__icon--mixed"
        aria-hidden="true"
        [style.visibility]="state() === 'mixed' ? 'visible' : 'hidden'">
        <line x1="3" y1="6" x2="9" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </span>
  </span>
  @if (label() || supportingText()) {
    <span class="iris-checkbox__content">
      <span class="iris-checkbox__label">{{ label() }}</span>
      @if (supportingText()) {
        <span class="iris-checkbox__supporting-text" [id]="supportingTextId">{{ supportingText() }}</span>
      }
    </span>
  }
</div>
