<span
  class="iris-badge"
  [class.iris-badge--info]="type() === 'info'"
  [class.iris-badge--success]="type() === 'success'"
  [class.iris-badge--error]="type() === 'error'"
  [class.iris-badge--warning]="type() === 'warning'"
  [class.iris-badge--strong]="strong()">
  @if (iconName(); as icon) {
    <iris-icon class="iris-badge__icon" [name]="icon" [size]="16" [decorative]="true" />
  }
  {{ text() }}
</span>
