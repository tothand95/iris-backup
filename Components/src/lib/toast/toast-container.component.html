@for (entry of toasts(); track entry.id) {
  <iris-toast
    [type]="entry.config.type ?? 'info'"
    [title]="entry.config.title"
    [supportingText]="entry.config.supportingText ?? ''"
    [dismissible]="entry.config.dismissible ?? true"
    [dismissAriaLabel]="entry.config.dismissAriaLabel ?? ''"
    [infoAriaLabel]="entry.config.infoAriaLabel ?? ''"
    [warningAriaLabel]="entry.config.warningAriaLabel ?? ''"
    [errorAriaLabel]="entry.config.errorAriaLabel ?? ''"
    [successAriaLabel]="entry.config.successAriaLabel ?? ''"
    [primaryActionLabel]="entry.config.primaryActionLabel ?? ''"
    [secondaryActionLabel]="entry.config.secondaryActionLabel ?? ''"
    [class.leaving]="entry.leaving"
    (dismissed)="initiateRemoval(entry.id)"
    (primaryAction)="primaryActionFired(entry.id)"
    (secondaryAction)="secondaryActionFired(entry.id)" />
}
