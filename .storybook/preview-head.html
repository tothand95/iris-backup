<style>
  /* Map Storybook Docs typography to the Iris UI roles
     (@oneidentity/iris-ui-tokens/dist/tokens.typography). Raw MDX markdown
     (e.g. the Introduction page) renders as plain elements inside
     .sbdocs-content, styled by addon-docs via zero-specificity :where()
     global selectors. Descendant selectors here override them; !important
     also covers the .sbdocs-* DocBlock components used by autodocs. Fonts
     are loaded in the preview iframe by iris-ui.css via @fontsource. */
  .sbdocs.sbdocs-wrapper {
    padding: 4vw !important;
  }

  /* Docs table-of-contents width. addon-docs hardcodes 10rem on both the
     aside and its fixed <nav>, so both are overridden here. */
  .sbdocs.sbdocs-toc--custom,
  .sbdocs.sbdocs-toc--custom > nav {
    width: 14rem !important;
  }

  .sbdocs.sbdocs-content {
    font-family: var(--oi-font-family-default) !important;
    font-size: var(--oi-text-body-s-font-size) !important;
    line-height: var(--oi-text-body-s-line-height) !important;
    font-weight: var(--oi-text-body-s-font-weight) !important;
  }

  .sbdocs-content h1,
  .sbdocs.sbdocs-h1 {
    font-family: var(--oi-font-family-default) !important;
    font-size: var(--oi-text-heading-01-font-size) !important;
    line-height: var(--oi-text-heading-01-line-height) !important;
    font-weight: var(--oi-text-heading-01-font-weight) !important;
    letter-spacing: var(--oi-letter-spacing-xs) !important;
  }

  .sbdocs-content h2,
  .sbdocs.sbdocs-h2 {
    font-family: var(--oi-font-family-default) !important;
    font-size: var(--oi-text-heading-03-font-size) !important;
    line-height: var(--oi-text-heading-03-line-height) !important;
    font-weight: var(--oi-text-heading-02-font-weight) !important;
    letter-spacing: var(--oi-letter-spacing-s) !important;
  }

  .sbdocs-content h3,
  .sbdocs.sbdocs-h3 {
    font-family: var(--oi-font-family-default) !important;
    font-size: var(--oi-text-heading-04-font-size) !important;
    line-height: var(--oi-text-heading-04-line-height) !important;
    font-weight: var(--oi-text-heading-03-font-weight) !important;
    letter-spacing: var(--oi-letter-spacing-m) !important;
  }

  .sbdocs-content h4,
  .sbdocs-content h5,
  .sbdocs-content h6,
  .sbdocs.sbdocs-h4,
  .sbdocs.sbdocs-h5,
  .sbdocs.sbdocs-h6 {
    font-family: var(--oi-font-family-default) !important;
    font-size: var(--oi-text-heading-05-font-size) !important;
    line-height: var(--oi-text-heading-05-line-height) !important;
    font-weight: var(--oi-text-heading-05-font-weight) !important;
  }

  .sbdocs-content p,
  .sbdocs-content li,
  .sbdocs.sbdocs-p,
  .sbdocs.sbdocs-li {
    font-family: var(--oi-font-family-default) !important;
    font-size: var(--oi-text-body-s-font-size) !important;
    line-height: var(--oi-text-body-s-line-height) !important;
    font-weight: var(--oi-text-body-s-font-weight) !important;
  }

  .sbdocs-content p strong,
  .sbdocs-content li strong {
    font-weight: var(--oi-text-body-s-strong-font-weight) !important;
  }

  .sbdocs-content code,
  .sbdocs-content pre,
  .sbdocs code,
  .sbdocs.sbdocs-pre,
  .sbdocs pre {
    font-family: var(--oi-text-code-font-family) !important;
    font-size: var(--oi-text-code-font-size) !important;
    line-height: var(--oi-text-code-line-height) !important;
    font-weight: var(--oi-text-code-font-weight) !important;
  }

  /* Inline code inside headings keeps the heading's size, matching
     addon-docs' `& code { font-size: inherit }` default. */
  .sbdocs-content :is(h1, h2, h3, h4, h5, h6) code {
    font-size: inherit !important;
    line-height: inherit !important;
  }
</style>
